    <!-- Comprehensive Rich JSON-LD Schema Graphs for Google Search Rank #1 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://jobpilot.dev/#website",
          "url": "https://jobpilot.dev/",
          "name": "JobPilot AI",
          "description": "Autonomous Reverse Recruiter & Career Copilot for Tech Professionals",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://jobpilot.dev/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://jobpilot.dev/#software",
          "name": "JobPilot AI",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "YC & Bangalore Startup Job Radar",
            "Google X-Y-Z Formula ATS Resume Tailoring",
            "CrackColdEmail 80% Response Founder Outreach",
            "Gmail Inbound Interview Tracker",
            "Live Developer Proof-of-Work Portfolio Studio"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://jobpilot.dev/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Why is cold emailing startup founders more effective than applying on job portals?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Traditional job portals receive 300 to 500 applications within hours of posting, causing candidates to get filtered out by rigid ATS parsers. Reaching out directly to founders or engineering leaders with a concise, proof-of-work message (Context + Relevance + Proof + Small Ask) achieves up to an 80% response rate because founders actively want self-driven builders."
              }
            },
            {
              "@type": "Question",
              "name": "What is the Google X-Y-Z resume formula?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Google X-Y-Z formula structures achievements as: 'Accomplished [X] as measured by [Y], by doing [Z]'. Instead of generic job duties, this format emphasizes quantifiable impact, low-latency metrics, and specific technical architectural decisions."
              }
            },
            {
              "@type": "Question",
              "name": "What is the typical salary for a Founding Engineer at a YC startup in Bangalore?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "For YC W24 and S24 startups hiring in Bangalore, early founding engineers typically receive ₹24 LPA to ₹48 LPA in annual cash compensation, paired with 0.5% to 1.5% equity (ESOPs) vesting over 4 years."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
